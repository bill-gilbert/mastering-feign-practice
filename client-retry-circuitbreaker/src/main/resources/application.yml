server:
  port: 18081

spring:
  application:
    name: caller-service
  cloud:
    openfeign:
      circuitbreaker:
        enabled: true
      client:
        config:
          default:
            connectTimeout: 500
            readTimeout: 1000
            loggerLevel: full

resilience4j:
  circuitbreaker:
    instances:
      # This matches CircuitBreakerConfiguration, not a generated Feign method name.
      calleeService:
        registerHealthIndicator: true
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 4
        minimumNumberOfCalls: 4
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 2
        automaticTransitionFromOpenToHalfOpenEnabled: true
        # A bad request must not mark a healthy service as unavailable.
        ignoreExceptions:
          - com.example.caller.client.CalleeClientException

management:
  endpoints:
    web:
      exposure:
        include: health,info,circuitbreakers,circuitbreakerevents,metrics
  endpoint:
    circuitbreakers:
      enabled: true
    circuitbreakerevents:
      enabled: true

callee:
  # The caller goes through the gateway by default. Set CALLEE_URL=http://localhost:18080
  # to compare this path with a direct Feign call.
  url: ${CALLEE_URL:http://localhost:18082/callee}
